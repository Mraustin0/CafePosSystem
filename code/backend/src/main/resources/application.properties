spring.application.name=cafe-pos
server.port=${PORT:8080}

# Boot fast on Render free tier (0.1 CPU / 512 MB): initialize beans on first use rather than up-front.
# Without this the app takes ~170s to bind the port and Render's port-scan times out before we ever
# start serving traffic. Trade-off: the very first request to each controller pays a small setup cost.
spring.main.lazy-initialization=true

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/cafepos}
spring.datasource.username=${DB_USERNAME:cafepos}
spring.datasource.password=${DB_PASSWORD:cafepos}

# Schema is owned by Flyway (src/main/resources/db/migration); Hibernate only validates.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

springdoc.swagger-ui.path=/swagger-ui.html

# Load lazy collections (e.g. Product.addOns) in batches instead of one query per row.
spring.jpa.properties.hibernate.default_batch_fetch_size=50
spring.data.web.pageable.max-page-size=100

# HS256 signing key, at least 32 bytes. Set JWT_SECRET in production; empty = random key per start.
app.jwt.secret=${JWT_SECRET:}
