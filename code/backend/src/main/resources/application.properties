spring.application.name=cafe-pos
server.port=${PORT:8080}

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/cafepos}
spring.datasource.username=${DB_USERNAME:cafepos}
spring.datasource.password=${DB_PASSWORD:cafepos}

# Schema is owned by Flyway (src/main/resources/db/migration); Hibernate only validates.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

springdoc.swagger-ui.path=/swagger-ui.html

# Load lazy collections (e.g. Product.addOns) in batches instead of one query per row.
spring.jpa.properties.hibernate.default_batch_fetch_size=50
spring.data.web.pageable.max-page-size=100
