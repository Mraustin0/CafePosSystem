services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: cafepos
      POSTGRES_USER: cafepos
      POSTGRES_PASSWORD: cafepos
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cafepos"]
      interval: 5s
      retries: 10

  app:
    build: .
    environment:
      DB_URL: jdbc:postgresql://db:5432/cafepos
      DB_USERNAME: cafepos
      DB_PASSWORD: cafepos
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
